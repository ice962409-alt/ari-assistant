name: Build Ari APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # Reconocer voces: la librería sherpa-onnx (Apache 2.0) y el modelo de huella de voz
      # CAM++ de WeSpeaker (Apache 2.0). No viven en el repositorio; se descargan y se revisa
      # su huella digital (sha256) para asegurar que son exactamente los que se revisaron.
      - name: Descargar piezas de reconocer voces
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets
          curl -fsSL --retry 3 -o app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          curl -fsSL --retry 3 -o app/src/main/assets/ari_voz.onnx \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_CAM++.onnx"
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -
          echo "c46fad10b5f81e1aa4a60c162714208577093655076c5450f8c469e522ec54ef  app/src/main/assets/ari_voz.onnx" | sha256sum -c -

      # Revisa que los enlaces de descarga de Gemma sigan vivos y anota su tamaño
      # (Ari los usa para saber cuánto espacio pedir). No detiene la compilación.
      - name: Revisar enlaces de los modelos
        continue-on-error: true
        run: |
          for model in E4B E2B; do
            url="https://huggingface.co/litert-community/gemma-4-${model}-it-litert-lm/resolve/main/gemma-4-${model}-it.litertlm"
            echo "== $model"
            curl -sSI "$url" | grep -iE "^HTTP|x-linked-size|x-linked-etag|^location" || true
          done

      - name: Pruebas automaticas
        run: ./gradlew :app:testCompletaDebugUnitTest :app:testOtrosDebugUnitTest

      # Las versiones de entrega (release): código revuelto, sin modo de depuración.
      - name: Compilar APK
        run: ./gradlew :app:assembleCompletaRelease :app:assembleOtrosRelease :app:assembleCompletaDebug :estado:assembleDebug

      # La Ari del dueño (la CEO, con su equipo de modelos), versión de entrega.
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ari-apk
          path: app/build/outputs/apk/completa/release/app-completa-release.apk

      # La Ari para otras personas (sin equipo de modelos), versión de entrega.
      - name: Guardar APK para otros
        uses: actions/upload-artifact@v4
        with:
          name: ari-otros-apk
          path: app/build/outputs/apk/otros/release/app-otros-release.apk

      # Por si la versión de entrega fallara en el teléfono: la de depuración del dueño.
      - name: Guardar APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: ari-debug-apk
          path: app/build/outputs/apk/completa/debug/app-completa-debug.apk

      # El mapa para leer los informes de fallo de las versiones revueltas.
      - name: Guardar mapa de nombres
        uses: actions/upload-artifact@v4
        with:
          name: ari-mapa
          path: app/build/outputs/mapping/

      - name: Guardar APK de Ari Estado
        uses: actions/upload-artifact@v4
        with:
          name: ari-estado-apk
          path: estado/build/outputs/apk/debug/estado-debug.apk
