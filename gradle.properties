# Memoria del proceso de Gradle: con la memoria por defecto (512 MiB y 384 MiB de Metaspace)
# se quedaba sin Metaspace al encoger las tres versiones de entrega con R8.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Robolectric (pruebas de la base de datos en la JVM) trae piezas de AndroidX
# (androidx.test:monitor); sin esta línea Gradle se niega a compilar las pruebas.
android.useAndroidX=true
